# ==========================================
#              HYPRLOCK CONFIG
#          Catppuccin • Minimal • Clean
# ==========================================

# ---------- BACKGROUND ----------

background {
    monitor =
    path = screenshot
    color = rgba(1e1e2eff)

    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


# ---------- GENERAL ----------

general {
    hide_cursor = true
    ignore_empty_input = true
}


# ---------- TIME ----------

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)

    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 180
    halign = center
    valign = center
}


# ---------- DATE ----------

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(7f849cff)

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 80
    halign = center
    valign = center
}


# ---------- USERNAME ----------

label {
    monitor =
    text = $USER
    color = rgba(cba6f7ff)

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, -180
    halign = center
    valign = center
}


# ---------- PASSWORD INPUT ----------

input-field {
    monitor =

    size = 360, 60
    outline_thickness = 2

    inner_color = rgba(30, 30, 46, 220)
    outer_color = rgba(cba6f7ff)

    font_color = rgba(cdd6f4ff)

    fade_on_empty = false
    rounding = 16

    placeholder_text = <i>Enter password...</i>
    hide_input = false

    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)

    fail_text = <i>Authentication failed</i>

    position = 0, -280
    halign = center
    valign = center
}


# ---------- CAPS LOCK ----------

label {
    monitor =
    text = cmd[update:500] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .capsLock')"
    color = rgba(f9e2afff)

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -350
    halign = center
    valign = center
}

