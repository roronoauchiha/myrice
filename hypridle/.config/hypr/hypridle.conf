$LOCK_CMD = hyprlock
$UNLOCK_CMD = true
general {
    lock_cmd = $LOCK_CMD
    unlock_cmd = $UNLOCK_CMD

    # Respect applications that request idle inhibition.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false

    # Optional sleep hooks:
    # before_sleep_cmd = ...
    # after_sleep_cmd = ...
}

# ------------------------------------------------------------
# Dim screen after 1 minute
# ------------------------------------------------------------

listener {
    timeout = 60

    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

# ------------------------------------------------------------
# Lock session after 2 minutes
# ------------------------------------------------------------

listener {
    timeout = 120

    on-timeout = loginctl lock-session
}

# ------------------------------------------------------------
# Turn monitors off after 5 minutes
# ------------------------------------------------------------

listener {
    timeout = 300

    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ------------------------------------------------------------
# Suspend machine after ~8 minutes
# ------------------------------------------------------------

listener {
    timeout = 500

    on-timeout = systemctl suspend
}

